runtime:
  project_root: /opt/mlsystem2/repo
  scratch_root: /data/mlsystem2/runtime/scratch
  logs_root: /data/mlsystem2/runtime/logs
  cleanup_scratch_after_mlflow_log: true

dataset:
  images_dir: /data/mlsystem2/prepared_images/
  negative_scene_limit: null

tile_preparation:
  num_workers: 16
  prefetch_factor: 2
  prefetch_epochs: null
  seed: 42
  smart_tiling: true
  val_positive_factor: null
  class_balance: false

train:
  task: binary
  input_channels: 4
  output_channels: 1
  pretrained: false
  device: cuda

inference:
  device: cuda

mlflow:
  enabled: true
  tracking_uri: http://127.0.0.1:5000
