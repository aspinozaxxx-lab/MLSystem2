<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Защита валидных пикселей при аугментациях</title>
  <desc id="desc">Условная схема: совместная геометрия переносит изображение и маску. Безопасная фотометрия сохраняется, а обнуляющий валидные пиксели блок отменяется без изменения геометрии.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <pattern id="nodata" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#e2e8f0"/><path d="M0 12 12 0" stroke="#94a3b8"/></pattern>
    <clipPath id="scene"><rect x="87" y="194" width="220" height="145" rx="8"/></clipPath>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="48" y="59" font-size="29" font-weight="700">Валидная вода не становится nodata</text>
    <text x="48" y="93" font-size="19" fill="#475569">Next-gen4-augmentation-v3 · общая нормализация по train</text>
    <rect x="48" y="130" width="310" height="340" rx="18" fill="white" stroke="#cbd5e1"/>
    <text x="72" y="169" font-size="21" font-weight="700">1. Общая геометрия</text>
    <rect x="87" y="194" width="220" height="145" rx="8" fill="#76a593"/>
    <path d="M132 194C245 235 100 280 242 339" fill="none" stroke="#193f5b" stroke-width="67" clip-path="url(#scene)"/>
    <rect x="87" y="194" width="30" height="145" fill="url(#nodata)"/>
    <rect x="87" y="194" width="220" height="145" rx="8" fill="none" stroke="#10b981" stroke-width="3"/>
    <text x="72" y="376" font-size="18">Снимок и все маски</text>
    <text x="72" y="404" font-size="18">перемещаются вместе.</text>
    <text x="72" y="438" font-size="14" fill="#475569">Valid-mask после геометрии — эталон.</text>
    <path d="M370 277H428" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="444" y="130" width="320" height="340" rx="18" fill="white" stroke="#cbd5e1"/>
    <text x="468" y="169" font-size="21" font-weight="700">2. Проверка фотометрии</text>
    <rect x="478" y="198" width="252" height="66" rx="9" fill="#ecfdf5" stroke="#10b981"/>
    <text x="494" y="224" font-size="18" fill="#047857">Маска сохранилась</text>
    <text x="494" y="249" font-size="17">Блок принимается.</text>
    <rect x="478" y="285" width="252" height="84" rx="9" fill="#fff1f2" stroke="#f43f5e"/>
    <text x="494" y="313" font-size="18" fill="#be123c">Вода стала [0, 0, 0, 0]</text>
    <text x="494" y="340" font-size="17">Блок отменяется целиком.</text>
    <text x="468" y="407" font-size="17">Не подменяем пиксели единицами.</text>
    <text x="468" y="437" font-size="17">Не перебираем случайные попытки.</text>
    <path d="M776 277H834" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="850" y="130" width="302" height="340" rx="18" fill="white" stroke="#cbd5e1"/>
    <text x="874" y="169" font-size="21" font-weight="700">3. Согласованный вход</text>
    <rect x="879" y="198" width="244" height="139" rx="9" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="896" y="234" font-size="19">Валидные пиксели</text>
    <text x="896" y="264" font-size="19">остаются валидными.</text>
    <text x="896" y="308" font-size="14" fill="#475569">Настоящий nodata остаётся нулём.</text>
    <text x="874" y="376" font-size="18">Разметка не противоречит</text>
    <text x="874" y="404" font-size="18">входным каналам модели.</text>
    <text x="874" y="438" font-size="16" fill="#475569">Защита применяется только в train.</text>
    <rect x="48" y="505" width="1104" height="118" rx="16" fill="#e2e8f0"/>
    <text x="72" y="541" font-size="19" font-weight="700">Это новый самостоятельный профиль, а не изменение старых весов.</text>
    <text x="72" y="573" font-size="18">Защита устраняет конфликт с nodata. Качество и устойчивость к сетке окон проверяются отдельно.</text>
    <text x="72" y="603" font-size="15" fill="#475569">Поясняющая схема с условными данными, не снимок и не результат распознавания.</text>
  </g>
</svg>
