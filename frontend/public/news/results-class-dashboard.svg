<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Все обучения класса на одной странице</title>
  <desc id="desc">Схема интерфейса: выбор класса слева, датасеты сверху, сети выбранного датасета и общая история обучений ниже.</desc>
  <rect width="1100" height="720" rx="22" fill="#f1f5f9"/>
  <rect width="1100" height="76" rx="22" fill="#0f172a"/>
  <rect y="40" width="1100" height="36" fill="#0f172a"/>
  <g font-family="Arial, sans-serif">
    <text x="32" y="48" font-size="26" font-weight="700" fill="#fff">ГРОВИКА · Результаты</text>
    <text x="1036" y="47" text-anchor="end" font-size="17" fill="#cbd5e1">Схема</text>
    <rect x="28" y="100" width="214" height="560" rx="12" fill="#fff"/>
    <text x="46" y="133" font-size="18" font-weight="700" fill="#334155">Классы</text>
    <rect x="40" y="154" width="190" height="42" rx="7" fill="#334155"/>
    <text x="51" y="181" font-size="16" fill="#fff">Границы леса</text>
    <text x="51" y="227" font-size="16" fill="#64748b">Заболачивание</text>
    <text x="51" y="267" font-size="16" fill="#64748b">ОКС500</text>
    <text x="51" y="307" font-size="16" fill="#64748b">Разрушки</text>
    <text x="270" y="132" font-size="21" font-weight="700" fill="#0f172a">1. Датасеты выбранного класса</text>
    <rect x="270" y="151" width="378" height="76" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="288" y="182" font-size="19" font-weight="700" fill="#075985">main</text>
    <text x="288" y="209" font-size="16" fill="#075985">Выбран · основной датасет</text>
    <rect x="664" y="151" width="404" height="76" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="682" y="182" font-size="19" font-weight="700" fill="#334155">test</text>
    <text x="682" y="209" font-size="16" fill="#64748b">Нажмите, чтобы выбрать здесь же</text>
    <text x="270" y="269" font-size="21" font-weight="700" fill="#0f172a">2. Сети выбранного датасета</text>
    <rect x="270" y="287" width="798" height="134" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <rect x="282" y="299" width="774" height="48" rx="6" fill="#f0f9ff"/>
    <text x="298" y="328" font-size="17" fill="#334155">Сеть А</text>
    <text x="525" y="328" font-size="17" fill="#334155">Валидация · Тестовый F1</text>
    <text x="868" y="328" font-size="17" fill="#0284c7">Действия</text>
    <text x="298" y="390" font-size="17" fill="#334155">Сеть Б · связанные псевдоразметки</text>
    <text x="270" y="465" font-size="21" font-weight="700" fill="#0f172a">3. Все обучения класса</text>
    <rect x="270" y="483" width="798" height="177" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <rect x="271" y="484" width="796" height="39" rx="9" fill="#e2e8f0"/>
    <text x="290" y="511" font-size="16" font-weight="700" fill="#475569">Статус</text>
    <text x="458" y="511" font-size="16" font-weight="700" fill="#475569">Датасет</text>
    <text x="650" y="511" font-size="16" font-weight="700" fill="#475569">Модель</text>
    <text x="900" y="511" font-size="16" font-weight="700" fill="#475569">Время</text>
    <text x="290" y="553" font-size="16" fill="#0284c7">Выполняется</text>
    <text x="458" y="553" font-size="16" fill="#334155">main</text>
    <text x="650" y="553" font-size="16" fill="#334155">Новая сеть</text>
    <text x="290" y="594" font-size="16" fill="#15803d">Готово</text>
    <text x="458" y="594" font-size="16" fill="#334155">test</text>
    <text x="650" y="594" font-size="16" fill="#334155">Предыдущая сеть</text>
    <text x="290" y="635" font-size="16" fill="#b91c1c">Ошибка</text>
    <text x="458" y="635" font-size="16" fill="#334155">main</text>
    <text x="650" y="635" font-size="16" fill="#334155">Ранний запуск</text>
    <text x="28" y="695" font-size="16" fill="#64748b">На телефоне — выбор класса сверху и карточки без горизонтальной прокрутки.</text>
  </g>
</svg>
