<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Согласованность v7: четыре геометрии контекста</title>
  <desc id="desc">Поясняющая схема. Только текущий train-вход без масштабирования. Обычная вырезка, квадрат и две полосы в полном окне. Пустая область исключена из цели. K/V отсоединены для query, обе собственные CE усредняются с общим весом 0,25.</desc>
  <defs><pattern id="empty" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#e9edf4"/><path d="M0 12L12 0" stroke="#cdd5e3"/></pattern></defs>
  <rect width="1200" height="680" rx="28" fill="#101b30"/>
  <g font-family="Arial, sans-serif" fill="#eef5ff">
    <text x="48" y="58" font-size="30" font-weight="700">Один train-вход — разные формы контекста</text>
    <text x="48" y="94" font-size="19" fill="#b9cbe4">Поясняющая схема • без масштабирования и координат дефекта</text>
    <g transform="translate(65 138)"><rect width="235" height="210" rx="14" fill="#1c3150"/><rect x="52" y="28" width="130" height="130" fill="#54c8b3"/><text x="118" y="191" font-size="18" text-anchor="middle">Обычная вырезка</text></g>
    <g transform="translate(345 138)"><rect width="235" height="210" rx="14" fill="#1c3150"/><rect x="43" y="15" width="150" height="150" fill="url(#empty)"/><rect x="61" y="61" width="75" height="75" fill="#54c8b3"/><text x="118" y="191" font-size="18" text-anchor="middle">Квадрат в полном окне</text></g>
    <g transform="translate(625 138)"><rect width="235" height="210" rx="14" fill="#1c3150"/><rect x="43" y="15" width="150" height="150" fill="url(#empty)"/><rect x="43" y="56" width="150" height="75" fill="#54c8b3"/><text x="118" y="191" font-size="18" text-anchor="middle">Горизонтальная полоса</text></g>
    <g transform="translate(905 138)"><rect width="235" height="210" rx="14" fill="#1c3150"/><rect x="43" y="15" width="150" height="150" fill="url(#empty)"/><rect x="87" y="15" width="75" height="150" fill="#54c8b3"/><text x="118" y="191" font-size="18" text-anchor="middle">Вертикальная полоса</text></g>
    <text x="600" y="386" text-anchor="middle" font-size="20">Равновероятный выбор • сторона 50% / 75% • сетка размещения 32</text>
    <text x="600" y="420" text-anchor="middle" font-size="19" fill="#b9cbe4">Пиксели, target и valid-mask переносятся вместе. Штриховка исключена из CE.</text>
    <path d="M600 442v32m-8-8 8 8 8-8" fill="none" stroke="#54c8b3" stroke-width="3"/>
    <rect x="73" y="490" width="1054" height="114" rx="16" fill="#1c3150"/>
    <text x="600" y="527" text-anchor="middle" font-size="22">Полный query + отсоединённые K/V источника</text>
    <text x="600" y="564" text-anchor="middle" font-size="21" fill="#54c8b3">0,25 × среднее(CE query, CE источника) • один шаг optimizer</text>
    <text x="600" y="645" text-anchor="middle" font-size="18" fill="#b9cbe4">Обычный инференс прежний. Это гипотеза, не доказательство устранения кругов.</text>
  </g>
</svg>
