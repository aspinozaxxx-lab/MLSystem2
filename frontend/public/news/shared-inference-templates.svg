<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">Общие шаблоны инференса и классы</title>
  <desc id="description">Схема: классы собраны плашками в общих шаблонах. Класс можно перенести через меню, а классу без шаблона сначала требуется назначение.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081b35"/><stop offset="1" stop-color="#213f64"/></linearGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#20c7dd"/><stop offset="1" stop-color="#278deb"/></linearGradient>
    <linearGradient id="green" x2="1" y2="1"><stop stop-color="#3acaa5"/><stop offset="1" stop-color="#159b94"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#01091b" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1440" height="960" rx="36" fill="url(#bg)"/>
  <g fill="none" stroke="#759bc0" stroke-opacity=".13"><circle cx="1270" cy="100" r="230"/><circle cx="1270" cy="100" r="175"/><path d="M0 890H1440M0 830H1440"/></g>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="64" y="48" width="136" height="40" rx="20" fill="#354d69"/><text x="132" y="76" text-anchor="middle" font-size="22" font-weight="600" fill="#c9e5fa">СХЕМА</text>
    <text x="64" y="153" font-size="54" font-weight="700" fill="#fff">Разные классы — общие настройки</text>
    <text x="64" y="203" font-size="28" fill="#bcd5ea">Создайте шаблон · Настройте параметры · Назначьте классы</text>
    <g filter="url(#shadow)"><rect x="64" y="260" width="610" height="357" rx="26" fill="#f6fbff"/><rect x="766" y="260" width="610" height="357" rx="26" fill="#f3fffa"/></g>
    <rect x="64" y="260" width="610" height="110" rx="26" fill="url(#blue)"/><rect x="64" y="340" width="610" height="30" fill="url(#blue)"/>
    <rect x="766" y="260" width="610" height="110" rx="26" fill="url(#green)"/><rect x="766" y="340" width="610" height="30" fill="url(#green)"/>
    <text x="98" y="327" font-size="38" font-weight="700" fill="#06233e">Подробные контуры</text><text x="800" y="327" font-size="38" font-weight="700" fill="#083e37">Очистка шума</text>
    <text x="98" y="414" font-size="24" fill="#536d86">Бережное упрощение границ</text><text x="800" y="414" font-size="24" fill="#487569">Удаление мелких объектов</text>
    <g fill="#deeffb" stroke="#afd2ec"><rect x="98" y="451" width="226" height="67" rx="33"/><rect x="341" y="451" width="285" height="67" rx="33"/></g>
    <g fill="#d8f4e9" stroke="#a5d8c9"><rect x="800" y="451" width="249" height="67" rx="33"/><rect x="800" y="535" width="270" height="51" rx="25" fill="#edf9f4" stroke-dasharray="6 5"/></g>
    <g font-size="29" font-weight="600" fill="#173b5d"><text x="122" y="494">Реки</text><text x="365" y="494">Здания</text></g>
    <text x="824" y="494" font-size="29" font-weight="600" fill="#194f42">Озёра</text><text x="824" y="569" font-size="25" fill="#528271">Дороги → сюда</text>
    <g fill="#3e6380"><circle cx="274" cy="484" r="3.5"/><circle cx="286" cy="484" r="3.5"/><circle cx="298" cy="484" r="3.5"/><circle cx="570" cy="484" r="3.5"/><circle cx="582" cy="484" r="3.5"/><circle cx="594" cy="484" r="3.5"/></g>
    <g fill="#347363"><circle cx="992" cy="484" r="3.5"/><circle cx="1004" cy="484" r="3.5"/><circle cx="1016" cy="484" r="3.5"/></g>
    <text x="98" y="564" font-size="23" fill="#536d86">Кнопка на плашке → перенос класса</text>
    <path d="M696 470H744M732 458L744 470L732 482" fill="none" stroke="#73e5de" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="666" width="1312" height="232" rx="26" fill="#f6f1e7"/>
    <path d="M104 716L126 754H82Z" fill="#ffc657" stroke="#b78422" stroke-width="2"/><path d="M104 727V738M104 745V747" stroke="#5e4214" stroke-width="3" stroke-linecap="round"/>
    <text x="151" y="752" font-size="34" font-weight="700" fill="#463c2a">Без шаблона</text>
    <rect x="98" y="779" width="269" height="59" rx="29" fill="#fff" stroke="#d7cab0"/><text x="122" y="818" font-size="26" font-weight="600" fill="#514632">Новый класс</text>
    <text x="407" y="807" font-size="27" fill="#594c32">Сначала назначьте шаблон</text>
    <text x="407" y="848" font-size="25" fill="#796d55">Предупреждение видно при обучении и создании псевдоразметки.</text>
  </g>
</svg>
