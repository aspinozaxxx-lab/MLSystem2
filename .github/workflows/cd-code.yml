name: доставка-кода

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "frontend/**"
      - "migrations/**"
      - "docs/**"
      - "configs/**"
      - "tests/**"
      - "alembic.ini"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/cd-code.yml"

jobs:
  copy-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Установить GDAL CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin

      - name: Установить dev-зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Запустить тесты
        run: |
          npm ci --prefix frontend
          npm run generate:api --prefix frontend
          npm run typecheck --prefix frontend
          npm test --prefix frontend
          python -m pytest
          python frontend/build.py
          python -m alembic upgrade head --sql > /tmp/mlsystem2_training_ui_migration.sql
          python -m compileall -q src tests

      - name: Настроить SSH-ключ
        env:
          SSH_KEY: ${{ secrets.MLSYSTEM2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/mlsystem2_key
          chmod 600 ~/.ssh/mlsystem2_key

      - name: Скопировать код репозитория
        env:
          SERVER_HOST: ${{ secrets.MLSYSTEM2_SERVER_HOST }}
          SERVER_USER: ${{ secrets.MLSYSTEM2_SERVER_USER }}
          SERVER_PORT: ${{ vars.MLSYSTEM2_SERVER_PORT || '22' }}
          TARGET_PATH: ${{ vars.MLSYSTEM2_DEPLOY_PATH || '/opt/mlsystem2/repo' }}
          FRONTEND_DIST_PATH: ${{ vars.MLSYSTEM2_FRONTEND_DIST_PATH || '/opt/mlsystem2/frontend' }}
          TRAINING_UI_API_SERVICE: ${{ vars.MLSYSTEM2_TRAINING_UI_API_SERVICE || 'mlsystem2-training-ui-api' }}
          TRAINING_UI_HEALTH_URL: ${{ vars.MLSYSTEM2_TRAINING_UI_HEALTH_URL || 'http://127.0.0.1:8091/api/v1/health' }}
          OLD_FRONTEND_SERVICE: ${{ vars.MLSYSTEM_OLD_FRONTEND_SERVICE || '' }}
        run: |
          SSH_CMD="ssh -i ~/.ssh/mlsystem2_key -p ${SERVER_PORT} -o StrictHostKeyChecking=accept-new"
          ${SSH_CMD} "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${TARGET_PATH}'"
          rsync -az --delete \
            -e "${SSH_CMD}" \
            --exclude ".git" \
            --exclude ".venv" \
            --exclude "__pycache__" \
            --exclude ".pytest_cache" \
            --exclude ".mypy_cache" \
            --exclude "data" \
            --exclude "runs" \
            --exclude "artifacts" \
            ./ "${SERVER_USER}@${SERVER_HOST}:${TARGET_PATH}/"
          ${SSH_CMD} "${SERVER_USER}@${SERVER_HOST}" "mkdir -p '${FRONTEND_DIST_PATH}'"
          rsync -az --delete \
            -e "${SSH_CMD}" \
            frontend/dist/ "${SERVER_USER}@${SERVER_HOST}:${FRONTEND_DIST_PATH}/"
          ${SSH_CMD} "${SERVER_USER}@${SERVER_HOST}" "printf '%s\n' '${GITHUB_SHA}' > '${TARGET_PATH}/DEPLOYED_COMMIT'"
          ${SSH_CMD} "${SERVER_USER}@${SERVER_HOST}" "if [ ! -x '${TARGET_PATH}/.venv/bin/python' ]; then python3 -m venv '${TARGET_PATH}/.venv'; fi"
          ${SSH_CMD} "${SERVER_USER}@${SERVER_HOST}" "cd '${TARGET_PATH}' && '${TARGET_PATH}/.venv/bin/python' -m pip install -e ."
          ${SSH_CMD} "${SERVER_USER}@${SERVER_HOST}" "cd '${TARGET_PATH}' && set -a && [ -f /etc/mlsystem2/training-ui-api.env ] && . /etc/mlsystem2/training-ui-api.env; set +a; '${TARGET_PATH}/.venv/bin/python' -m alembic upgrade head"
          if [ -n "${OLD_FRONTEND_SERVICE}" ]; then
            ${SSH_CMD} "${SERVER_USER}@${SERVER_HOST}" "systemctl disable --now '${OLD_FRONTEND_SERVICE}' || true"
          fi
          ${SSH_CMD} "${SERVER_USER}@${SERVER_HOST}" "systemctl restart '${TRAINING_UI_API_SERVICE}'"
          ${SSH_CMD} "${SERVER_USER}@${SERVER_HOST}" "for attempt in \$(seq 1 30); do curl --fail --silent --show-error '${TRAINING_UI_HEALTH_URL}' && exit 0; sleep 2; done; exit 1"
